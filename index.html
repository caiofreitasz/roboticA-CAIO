
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Futuro da Inteligência Artificial</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="caixa-principal">
        <h1>Você decide o futuro da IA</h1>

        <div class="tela-inicial">
            <p>
                Em 2049, a Inteligência Artificial transformou o mundo.
                As máquinas estão cada vez mais inteligentes e agora
                precisamos decidir como será o futuro da humanidade.
                Suas escolhas poderão mudar tudo!
            </p>
            <button class="iniciar-btn">Iniciar missão</button>
        </div>

        <div class="caixa-perguntas"></div>
        <div class="caixa-alternativas"></div>

        <div class="caixa-resultado">
            <p class="texto-resultado"></p>
            <button class="novamente-btn">Jogar novamente</button>
        </div>
    </div>

</body>
</html>
